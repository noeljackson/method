[package]
name = "noel-method"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
description = "Portable runtime tooling for the Noel Method"
license = "MIT"
repository = "https://github.com/noeljackson/method"
readme = "README.md"
build = "runtime/build.rs"
publish = ["crates-io"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/CHANGELOG.md",
  "/LICENSE",
  "/MIGRATION.md",
  "/README.md",
  "/VERSION",
  "/adapters/**",
  "/casebook/**",
  "/dist/MONOLITH.md",
  "/dist/pack/**",
  "/evals/README.md",
  "/evals/RUBRIC.md",
  "/evals/scenarios.json",
  "/migration/**",
  "/protocols/**",
  "/runtime/**",
  "/schemas/**",
  "/src/**",
  "/templates/**",
  "/tests/rust_cli.rs",
  "/tests/rust_contracts.rs",
]

[lib]
name = "method_core"
path = "runtime/core/lib.rs"

[[bin]]
name = "method"
path = "runtime/cli/main.rs"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
include_dir = "0.7.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
thiserror = "2.0.12"
toml = "1.1.4"

[build-dependencies]
serde_json = "1.0.142"

[dev-dependencies]
tempfile = "3.20.0"

[workspace]
resolver = "2"
